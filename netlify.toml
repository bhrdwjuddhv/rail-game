# Netlify: static deploy of the browser game (client/). The repo is an npm
# workspaces monorepo, so the build runs from the root: `npm install` links
# @rail/shared, then `npm run build` type-checks shared + client and runs
# `vite build` into client/dist. Game data (data/) is bundled into the build.

[build]
  base = "."
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------- routing
# The game is a single page (scenarios, bench etc. are ?query parameters).
# Missing files under /assets/ must stay real 404s: optional textures and
# UI images that are not there yet fall back to the built-in procedural
# ones, which only works if the request fails instead of getting HTML back.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Any other unknown path (old links, typos) opens the game.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# index.html: always revalidate so a new deploy is picked up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite's hashed bundles (JS, CSS, worker, wasm): safe to cache forever
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/wasm"

# Un-hashed files from client/public/assets (UI images, textures, manifest):
# cache for a day, then revalidate, so replaced artwork shows up
[[headers]]
  for = "/assets/ui/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
[[headers]]
  for = "/assets/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
[[headers]]
  for = "/assets/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
